name: Process Reel queue

on:
  workflow_dispatch:
    inputs:
      target_reel_id:
        description: 'Queue Reel UUID for an app-triggered immediate publication'
        required: false
        type: string
      max_video_imports:
        description: 'Maximum archive URLs for this worker run'
        required: false
        default: '1'
        type: choice
        options: ['1', '3', '5']
  schedule:
    # Background queue poller only; this is not an individual Reel posting schedule.
    # Offset from minute 00 to reduce scheduled-run contention.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: reelflow-publish-queue
  cancel-in-progress: false

jobs:
  process:
    if: ${{ vars.REEL_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Process one queued Reel and archive URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v26.0' }}
          IG_API_MODE: instagram_login
          PUBLIC_UPLOAD_MODE: ${{ vars.PUBLIC_UPLOAD_MODE || 'cloudinary' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          MAX_POSTS_PER_RUN: '1'
          MAX_VIDEO_IMPORTS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_video_imports || '3' }}
          STATUS_POLL_SECONDS: '30'
          STATUS_POLL_ATTEMPTS: '10'
          CONTENT_RIGHTS_CONFIRMED: 'true'
          TARGET_REEL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_reel_id || '' }}
          DATA_DIR: ./data
        run: python -m reels_transfer.github_worker
