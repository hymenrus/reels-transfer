name: Process Reel queue

on:
  workflow_dispatch:
  schedule:
    # Background queue poller only; this is not an individual Reel posting schedule.
    # Offset from minute 00 to reduce scheduled-run contention.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: reelflow-publish-queue
  cancel-in-progress: false

jobs:
  process:
    if: ${{ vars.REEL_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Process one user's queued Reel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v26.0' }}
          IG_API_MODE: instagram_login
          PUBLIC_UPLOAD_MODE: ${{ vars.PUBLIC_UPLOAD_MODE || 'cloudinary' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          MAX_POSTS_PER_RUN: '1'
          STATUS_POLL_SECONDS: '30'
          STATUS_POLL_ATTEMPTS: '10'
          CONTENT_RIGHTS_CONFIRMED: 'true'
          DATA_DIR: ./data
        run: python -m reels_transfer.github_worker
